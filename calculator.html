<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <script>
    (function () {
      var saved = localStorage.getItem("calc-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
  <style>
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      --page-bg: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --calc-bg: #1e1e2f;
      --calc-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --display-bg: #12121a;
      --expression: #888;
      --result: #e8e8e8;
      --digit-bg: #2d2d44;
      --digit-hover: #3a3a55;
      --digit-fg: #fff;
      --op-bg: #394867;
      --op-hover: #4a5a7a;
      --op-fg: #7eb8ff;
      --fn-bg: #4a3f5c;
      --fn-hover: #5c4f70;
      --fn-fg: #ffb86c;
      --theme-toggle-bg: #2d2d44;
      --theme-toggle-hover: #3a3a55;
      --theme-toggle-fg: #e8e8e8;
    }

    [data-theme="light"] {
      color-scheme: light;
      --page-bg: linear-gradient(145deg, #eef2f7 0%, #dde4ee 50%, #c9d4e4 100%);
      --calc-bg: #f4f5f8;
      --calc-shadow: 0 16px 40px rgba(30, 40, 60, 0.15);
      --display-bg: #ffffff;
      --expression: #6b7280;
      --result: #1f2937;
      --digit-bg: #e5e7eb;
      --digit-hover: #d1d5db;
      --digit-fg: #111827;
      --op-bg: #dbeafe;
      --op-hover: #bfdbfe;
      --op-fg: #1d4ed8;
      --fn-bg: #f3e8ff;
      --fn-hover: #e9d5ff;
      --fn-fg: #b45309;
      --theme-toggle-bg: #e5e7eb;
      --theme-toggle-hover: #d1d5db;
      --theme-toggle-fg: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--page-bg);
      transition: background 0.25s ease;
    }

    .calculator {
      width: min(320px, 92vw);
      background: var(--calc-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--calc-shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .calc-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-toggle {
      background: var(--theme-toggle-bg);
      color: var(--theme-toggle-fg);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .theme-toggle:hover {
      background: var(--theme-toggle-hover);
    }

    .display {
      background: var(--display-bg);
      border-radius: 10px;
      padding: 16px 14px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: background 0.25s ease;
    }

    .expression {
      color: var(--expression);
      font-size: 0.85rem;
      min-height: 1.2em;
      word-break: break-all;
    }

    .result {
      color: var(--result);
      font-size: 2rem;
      font-weight: 600;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px 0;
      font-size: 1.15rem;
      cursor: pointer;
      transition: transform 0.08s, background 0.15s;
      font-family: inherit;
    }

    button:active {
      transform: scale(0.96);
    }

    .digit {
      background: var(--digit-bg);
      color: var(--digit-fg);
    }

    .digit:hover {
      background: var(--digit-hover);
    }

    .op {
      background: var(--op-bg);
      color: var(--op-fg);
    }

    .op:hover {
      background: var(--op-hover);
    }

    .fn {
      background: var(--fn-bg);
      color: var(--fn-fg);
    }

    .fn:hover {
      background: var(--fn-hover);
    }

    .fn.clear {
      background: #c0392b;
      color: #fff;
    }

    .fn.clear:hover {
      background: #e74c3c;
    }

    .equals {
      background: #e94560;
      color: #fff;
      grid-column: span 2;
    }

    .equals:hover {
      background: #ff5577;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Калькулятор">
    <div class="calc-header">
      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-pressed="false"
        aria-label="Переключить на светлую тему"
      >Светлая тема</button>
    </div>
    <div class="display">
      <div class="expression" id="expression" aria-live="polite"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button type="button" class="fn clear" data-action="clear">C</button>
      <button type="button" class="fn" data-action="backspace">⌫</button>
      <button type="button" class="fn" data-action="percent">%</button>
      <button type="button" class="op" data-action="operator" data-op="/">÷</button>

      <button type="button" class="digit" data-action="digit" data-digit="7">7</button>
      <button type="button" class="digit" data-action="digit" data-digit="8">8</button>
      <button type="button" class="digit" data-action="digit" data-digit="9">9</button>
      <button type="button" class="op" data-action="operator" data-op="*">×</button>

      <button type="button" class="digit" data-action="digit" data-digit="4">4</button>
      <button type="button" class="digit" data-action="digit" data-digit="5">5</button>
      <button type="button" class="digit" data-action="digit" data-digit="6">6</button>
      <button type="button" class="op" data-action="operator" data-op="-">−</button>

      <button type="button" class="digit" data-action="digit" data-digit="1">1</button>
      <button type="button" class="digit" data-action="digit" data-digit="2">2</button>
      <button type="button" class="digit" data-action="digit" data-digit="3">3</button>
      <button type="button" class="op" data-action="operator" data-op="+">+</button>

      <button type="button" class="digit zero" data-action="digit" data-digit="0">0</button>
      <button type="button" class="digit" data-action="decimal">,</button>
      <button type="button" class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");
    const themeToggle = document.getElementById("theme-toggle");

    function getTheme() {
      return document.documentElement.dataset.theme === "light" ? "light" : "dark";
    }

    function updateThemeToggle() {
      const light = getTheme() === "light";
      themeToggle.textContent = light ? "Тёмная тема" : "Светлая тема";
      themeToggle.setAttribute("aria-pressed", light ? "true" : "false");
      themeToggle.setAttribute(
        "aria-label",
        light ? "Переключить на тёмную тему" : "Переключить на светлую тему"
      );
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("calc-theme", theme);
      updateThemeToggle();
    }

    themeToggle.addEventListener("click", () => {
      setTheme(getTheme() === "light" ? "dark" : "light");
    });

    updateThemeToggle();

    let current = "0";
    let stored = null;
    let pendingOp = null;
    let freshStart = false;

    const OP_SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function formatDisplay(numStr) {
      if (numStr === "Ошибка") return numStr;
      const n = parseFloat(numStr.replace(",", "."));
      if (!Number.isFinite(n)) return "0";
      const s = String(n);
      return s.includes(".") ? s.replace(".", ",") : s;
    }

    function updateDisplay() {
      resultEl.textContent = formatDisplay(current);
      if (stored !== null && pendingOp) {
        expressionEl.textContent =
          formatDisplay(String(stored)) + " " + OP_SYMBOL[pendingOp];
      } else {
        expressionEl.textContent = "";
      }
    }

    function inputDigit(d) {
      if (freshStart || current === "Ошибка") {
        current = d;
        freshStart = false;
      } else if (current === "0") {
        current = d;
      } else if (current.replace("-", "").replace(",", "").length < 12) {
        current += d;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (freshStart || current === "Ошибка") {
        current = "0,";
        freshStart = false;
      } else if (!current.includes(",")) {
        current += ",";
      }
      updateDisplay();
    }

    function clearAll() {
      current = "0";
      stored = null;
      pendingOp = null;
      freshStart = false;
      updateDisplay();
    }

    function backspace() {
      if (current === "Ошибка") {
        clearAll();
        return;
      }
      if (freshStart) return;
      if (current.length <= 1 || (current.length === 2 && current.startsWith("-"))) {
        current = "0";
      } else {
        current = current.slice(0, -1);
      }
      updateDisplay();
    }

    function toNumber(str) {
      return parseFloat(str.replace(",", "."));
    }

    function compute(a, op, b) {
      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/":
          if (b === 0) return null;
          return a / b;
        default: return b;
      }
    }

    function applyPending() {
      if (stored === null || !pendingOp) return;
      const a = stored;
      const b = toNumber(current);
      const out = compute(a, pendingOp, b);
      if (out === null) {
        current = "Ошибка";
        stored = null;
        pendingOp = null;
        freshStart = true;
        return;
      }
      stored = out;
      current = String(out);
    }

    function setOperator(op) {
      if (current === "Ошибка") return;
      const value = toNumber(current);
      if (stored !== null && pendingOp && !freshStart) {
        applyPending();
        if (current === "Ошибка") {
          updateDisplay();
          return;
        }
        stored = toNumber(current);
      } else {
        stored = value;
      }
      pendingOp = op;
      freshStart = true;
      updateDisplay();
    }

    function equals() {
      if (pendingOp === null || stored === null || current === "Ошибка") return;
      applyPending();
      pendingOp = null;
      stored = null;
      freshStart = true;
      updateDisplay();
    }

    function percent() {
      if (current === "Ошибка") return;
      const n = toNumber(current) / 100;
      current = String(n);
      updateDisplay();
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;

      switch (action) {
        case "digit":
          inputDigit(btn.dataset.digit);
          break;
        case "decimal":
          inputDecimal();
          break;
        case "operator":
          setOperator(btn.dataset.op);
          break;
        case "equals":
          equals();
          break;
        case "clear":
          clearAll();
          break;
        case "backspace":
          backspace();
          break;
        case "percent":
          percent();
          break;
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
      else if (e.key === "." || e.key === ",") inputDecimal();
      else if (e.key === "+") setOperator("+");
      else if (e.key === "-") setOperator("-");
      else if (e.key === "*") setOperator("*");
      else if (e.key === "/") {
        e.preventDefault();
        setOperator("/");
      } else if (e.key === "Enter" || e.key === "=") equals();
      else if (e.key === "Escape") clearAll();
      else if (e.key === "Backspace") backspace();
      else if (e.key === "%") percent();
    });

    updateDisplay();
  </script>
</body>
</html>
