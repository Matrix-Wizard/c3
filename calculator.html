<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <script>
    (function () {
      var saved = localStorage.getItem("calc-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
  <style>
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      --page-bg: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --calc-bg: #1e1e2f;
      --calc-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --display-bg: #12121a;
      --expression: #888;
      --result: #e8e8e8;
      --digit-bg: #2d2d44;
      --digit-hover: #3a3a55;
      --digit-fg: #fff;
      --op-bg: #394867;
      --op-hover: #4a5a7a;
      --op-fg: #7eb8ff;
      --fn-bg: #4a3f5c;
      --fn-hover: #5c4f70;
      --fn-fg: #ffb86c;
      --theme-toggle-bg: #2d2d44;
      --theme-toggle-hover: #3a3a55;
      --theme-toggle-fg: #e8e8e8;
      --history-bg: #12121a;
      --history-border: #2d2d44;
      --history-title: #aaa;
      --history-text: #c8c8d0;
      --history-time: #666;
      --history-empty: #666;
      --history-clear-bg: #2d2d44;
      --history-clear-hover: #3a3a55;
      --history-clear-fg: #aaa;
    }

    [data-theme="light"] {
      color-scheme: light;
      --page-bg: linear-gradient(145deg, #eef2f7 0%, #dde4ee 50%, #c9d4e4 100%);
      --calc-bg: #f4f5f8;
      --calc-shadow: 0 16px 40px rgba(30, 40, 60, 0.15);
      --display-bg: #ffffff;
      --expression: #6b7280;
      --result: #1f2937;
      --digit-bg: #e5e7eb;
      --digit-hover: #d1d5db;
      --digit-fg: #111827;
      --op-bg: #dbeafe;
      --op-hover: #bfdbfe;
      --op-fg: #1d4ed8;
      --fn-bg: #f3e8ff;
      --fn-hover: #e9d5ff;
      --fn-fg: #b45309;
      --theme-toggle-bg: #e5e7eb;
      --theme-toggle-hover: #d1d5db;
      --theme-toggle-fg: #374151;
      --history-bg: #ffffff;
      --history-border: #e5e7eb;
      --history-title: #6b7280;
      --history-text: #374151;
      --history-time: #9ca3af;
      --history-empty: #9ca3af;
      --history-clear-bg: #e5e7eb;
      --history-clear-hover: #d1d5db;
      --history-clear-fg: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--page-bg);
      transition: background 0.25s ease;
      padding: 20px;
    }

    .app {
      display: flex;
      align-items: stretch;
      gap: 16px;
      max-width: 100%;
    }

    .calculator {
      width: min(320px, 92vw);
      flex-shrink: 0;
      background: var(--calc-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--calc-shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .calc-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-toggle {
      background: var(--theme-toggle-bg);
      color: var(--theme-toggle-fg);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .theme-toggle:hover {
      background: var(--theme-toggle-hover);
    }

    .display {
      background: var(--display-bg);
      border-radius: 10px;
      padding: 16px 14px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: background 0.25s ease;
    }

    .expression {
      color: var(--expression);
      font-size: 0.85rem;
      min-height: 1.2em;
      word-break: break-all;
    }

    .result {
      color: var(--result);
      font-size: 2rem;
      font-weight: 600;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px 0;
      font-size: 1.15rem;
      cursor: pointer;
      transition: transform 0.08s, background 0.15s;
      font-family: inherit;
    }

    button:active {
      transform: scale(0.96);
    }

    .digit {
      background: var(--digit-bg);
      color: var(--digit-fg);
    }

    .digit:hover {
      background: var(--digit-hover);
    }

    .op {
      background: var(--op-bg);
      color: var(--op-fg);
    }

    .op:hover {
      background: var(--op-hover);
    }

    .fn {
      background: var(--fn-bg);
      color: var(--fn-fg);
    }

    .fn:hover {
      background: var(--fn-hover);
    }

    .fn.clear {
      background: #c0392b;
      color: #fff;
    }

    .fn.clear:hover {
      background: #e74c3c;
    }

    .equals {
      background: #e94560;
      color: #fff;
      grid-column: span 2;
    }

    .equals:hover {
      background: #ff5577;
    }

    .zero {
      grid-column: span 2;
    }

    .history {
      width: min(260px, 42vw);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--history-bg);
      border: 1px solid var(--history-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--calc-shadow);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .history-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--history-title);
    }

    .history-clear {
      background: var(--history-clear-bg);
      color: var(--history-clear-fg);
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .history-clear:hover:not(:disabled) {
      background: var(--history-clear-hover);
    }

    .history-clear:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .history-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    @media (max-width: 640px) {
      .app {
        flex-direction: column;
        align-items: center;
      }

      .history {
        width: min(320px, 92vw);
        max-height: 200px;
      }
    }

    .history-empty {
      font-size: 0.8rem;
      color: var(--history-empty);
      text-align: center;
      padding: 4px 0;
    }

    .history-item {
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--history-text);
      word-break: break-all;
    }

    .history-item time {
      display: block;
      font-size: 0.65rem;
      color: var(--history-time);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="calculator" role="application" aria-label="Калькулятор">
      <div class="calc-header">
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-pressed="false"
          aria-label="Переключить на светлую тему"
        >Светлая тема</button>
      </div>
      <div class="display">
        <div class="expression" id="expression" aria-live="polite"></div>
        <div class="result" id="result">0</div>
      </div>
      <div class="keys">
      <button type="button" class="fn clear" data-action="clear">C</button>
      <button type="button" class="fn" data-action="backspace">⌫</button>
      <button type="button" class="fn" data-action="percent">%</button>
      <button type="button" class="op" data-action="operator" data-op="/">÷</button>

      <button type="button" class="digit" data-action="digit" data-digit="7">7</button>
      <button type="button" class="digit" data-action="digit" data-digit="8">8</button>
      <button type="button" class="digit" data-action="digit" data-digit="9">9</button>
      <button type="button" class="op" data-action="operator" data-op="*">×</button>

      <button type="button" class="digit" data-action="digit" data-digit="4">4</button>
      <button type="button" class="digit" data-action="digit" data-digit="5">5</button>
      <button type="button" class="digit" data-action="digit" data-digit="6">6</button>
      <button type="button" class="op" data-action="operator" data-op="-">−</button>

      <button type="button" class="digit" data-action="digit" data-digit="1">1</button>
      <button type="button" class="digit" data-action="digit" data-digit="2">2</button>
      <button type="button" class="digit" data-action="digit" data-digit="3">3</button>
      <button type="button" class="op" data-action="operator" data-op="+">+</button>

      <button type="button" class="digit zero" data-action="digit" data-digit="0">0</button>
      <button type="button" class="digit" data-action="decimal">,</button>
      <button type="button" class="equals" data-action="equals">=</button>
      </div>
    </div>
    <section class="history" aria-label="Журнал операций">
      <div class="history-header">
        <span class="history-title">Журнал операций</span>
        <button
          type="button"
          class="history-clear"
          id="history-clear"
          disabled
          aria-label="Очистить журнал операций"
        >Очистить</button>
      </div>
      <ul class="history-list" id="history-list" aria-live="polite">
        <li class="history-empty" id="history-empty">Пока нет записей</li>
      </ul>
    </section>
  </div>

  <script type="module">
    import {
      Calculator,
      HistoryStore,
      formatHistoryTime,
      HISTORY_MAX,
    } from "./calculator.js";

    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");
    const themeToggle = document.getElementById("theme-toggle");
    const historyListEl = document.getElementById("history-list");
    const historyEmptyEl = document.getElementById("history-empty");
    const historyClearBtn = document.getElementById("history-clear");

    const HISTORY_KEY = "calc-history";
    const historyStore = new HistoryStore(HISTORY_KEY, HISTORY_MAX);
    const calc = new Calculator();

    function getTheme() {
      return document.documentElement.dataset.theme === "light" ? "light" : "dark";
    }

    function updateThemeToggle() {
      const light = getTheme() === "light";
      themeToggle.textContent = light ? "Тёмная тема" : "Светлая тема";
      themeToggle.setAttribute("aria-pressed", light ? "true" : "false");
      themeToggle.setAttribute(
        "aria-label",
        light ? "Переключить на тёмную тему" : "Переключить на светлую тему"
      );
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("calc-theme", theme);
      updateThemeToggle();
    }

    themeToggle.addEventListener("click", () => {
      setTheme(getTheme() === "light" ? "dark" : "light");
    });

    updateThemeToggle();

    function renderHistory() {
      historyListEl.querySelectorAll(".history-item").forEach((el) => el.remove());
      historyEmptyEl.hidden = historyStore.entries.length > 0;
      historyClearBtn.disabled = historyStore.entries.length === 0;

      historyStore.entries.forEach((entry) => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = entry.text;
        if (entry.at) {
          const timeEl = document.createElement("time");
          timeEl.dateTime = entry.at;
          timeEl.textContent = formatHistoryTime(entry.at);
          li.appendChild(timeEl);
        }
        historyListEl.appendChild(li);
      });
    }

    function addHistoryEntry(text) {
      historyStore.add(text);
      localStorage.setItem(HISTORY_KEY, historyStore.serialize());
      renderHistory();
    }

    function clearHistory() {
      historyStore.clear();
      localStorage.setItem(HISTORY_KEY, historyStore.serialize());
      renderHistory();
    }

    historyClearBtn.addEventListener("click", clearHistory);
    historyStore.load(localStorage.getItem(HISTORY_KEY));
    renderHistory();

    function updateDisplay() {
      resultEl.textContent = calc.getResult();
      expressionEl.textContent = calc.getExpression();
    }

    function equals() {
      const line = calc.equals();
      if (line) addHistoryEntry(line);
      updateDisplay();
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;

      switch (action) {
        case "digit":
          calc.inputDigit(btn.dataset.digit);
          break;
        case "decimal":
          calc.inputDecimal();
          break;
        case "operator":
          calc.setOperator(btn.dataset.op);
          break;
        case "equals":
          equals();
          break;
        case "clear":
          calc.clearAll();
          break;
        case "backspace":
          calc.backspace();
          break;
        case "percent":
          calc.percent();
          break;
      }

      updateDisplay();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") calc.inputDigit(e.key);
      else if (e.key === "." || e.key === ",") calc.inputDecimal();
      else if (e.key === "+") calc.setOperator("+");
      else if (e.key === "-") calc.setOperator("-");
      else if (e.key === "*") calc.setOperator("*");
      else if (e.key === "/") {
        e.preventDefault();
        calc.setOperator("/");
      } else if (e.key === "Enter" || e.key === "=") equals();
      else if (e.key === "Escape") calc.clearAll();
      else if (e.key === "Backspace") calc.backspace();
      else if (e.key === "%") calc.percent();
      else return;

      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
